repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # RESULTS.md is generated; its metadata block uses Markdown hard breaks.
        exclude: ^(src/oort_lang/parser/grammar/|benchmarks/RESULTS\.md$)
      - id: end-of-file-fixer
        exclude: ^src/oort_lang/parser/grammar/
      - id: check-yaml
        # mkdocs.yml uses pymdownx's Python-tagged slugify hook.
        args: [--unsafe]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(docs/|examples/|src/oort_lang/parser/grammar/)
      - id: ruff-format
        exclude: ^(docs/|examples/|src/oort_lang/parser/grammar/)

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Run in the project environment (uv) so the same mypy version and
        # dependencies as CI are used.
        entry: uv run --frozen mypy src/
        language: system
        types: [python]
        pass_filenames: false
